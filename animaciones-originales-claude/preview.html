<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escenas de pago Hesloy</title>
<link rel="stylesheet" href="animations.css">
<style>
  :root {
    --page: #EAE5DA;
    --ink: #2B2117;
    --muted: #7A6A55;
    --line: #D8CDBA;
    --day: #F4F1EA;
    --day-ink: #6B4E23;
    --night: #0C0A09;
    --night-ink: #F2EDE2;
    --gold: #D9BC77;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 56px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 { font: 500 clamp(24px, 4vw, 34px)/1.15 ui-serif, Georgia, "Times New Roman", serif; margin: 0 0 4px; letter-spacing: .01em; }
  h2 { font: 500 20px/1.2 ui-serif, Georgia, serif; margin: 40px 0 14px; }
  .sub { color: var(--muted); margin: 0; }

  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--day-ink); color: var(--day); }

  /* Paneles día / noche */
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  body[data-view="dia"] .panel--noche, body[data-view="noche"] .panel--dia { display: none; }
  .panel { border-radius: 18px; padding: 18px 16px 20px; }
  .panel--dia { background: var(--day); color: var(--day-ink); border: 1px solid var(--line); }
  .panel--noche { background: var(--night); color: var(--night-ink); border: 1px solid #2A231C; }
  .panel-title { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 0 0 12px; }

  /* Simulación de opciones de pago del checkout */
  .opts { display: grid; gap: 12px; }
  .opt {
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start;
    padding: 14px; border-radius: 14px; cursor: pointer;
    background: rgba(255,255,255,.6); border: 1px solid rgba(107,78,35,.16);
  }
  .panel--noche .opt { background: #15110E; border-color: rgba(217,188,119,.18); }
  .opt input { margin: 3px 0 0; accent-color: var(--day-ink); width: 18px; height: 18px; }
  .panel--noche .opt input { accent-color: var(--gold); }
  .opt strong { font-weight: 600; }
  .opt small { grid-column: 2; opacity: .75; }
  .opt .art { grid-column: 1 / -1; width: 100%; max-width: 300px; margin: 6px auto 0; }
  .opt:has(input:checked) { border-color: currentColor; }

  /* Tamaños */
  .sizes { display: grid; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .cell { flex: 0 0 auto; }
  .cell span { display: block; font-size: 12px; opacity: .65; margin-bottom: 4px; }
  .w260 { width: 260px; } .w280 { width: 280px; } .w300 { width: 300px; }

  /* Vista ampliada */
  .big { display: grid; gap: 16px; }
  .big .panel { padding: 12px; }
  .big .hsa-slot { max-width: 960px; margin: 0 auto; }

  @media (max-width: 420px) {
    .panel { padding: 14px 8px 16px; border-radius: 14px; }
    .opt { padding: 12px 10px; }
    .opt .art { width: calc(100% + 20px); max-width: none; margin: 6px -10px 0; }
  }
  @media (max-width: 360px) {
    .w280, .w300 { width: 100%; }
  }
</style>
</head>
<body data-view="ambos">
<div class="wrap">
  <header>
    <div>
      <h1>Escenas de pago</h1>
      <p class="sub">Contra entrega, transferencia y tarjeta, en bucle continuo.</p>
    </div>
    <div class="seg" role="group" aria-label="Tema">
      <button type="button" data-view="ambos" aria-pressed="true">Día y noche</button>
      <button type="button" data-view="dia" aria-pressed="false">Día</button>
      <button type="button" data-view="noche" aria-pressed="false">Noche</button>
    </div>
  </header>

  <section class="themes" aria-label="Escenas en contexto">
    <div class="panel panel--dia" data-hsa-theme="dia">
      <p class="panel-title">Día</p>
      <div class="opts">
        <label class="opt"><input type="radio" name="pago-dia" checked><strong>Pago contra entrega</strong><small>Pagas en efectivo al recibir tu pedido.</small><div class="art hsa-slot" data-hsa-scene="contra-entrega"></div></label>
        <label class="opt"><input type="radio" name="pago-dia"><strong>Transferencia bancaria</strong><small>Te enviamos los datos para transferir.</small><div class="art hsa-slot" data-hsa-scene="transferencia"></div></label>
        <label class="opt"><input type="radio" name="pago-dia"><strong>Tarjeta</strong><small>Débito o crédito con POS al recibir.</small><div class="art hsa-slot" data-hsa-scene="tarjeta-pos"></div></label>
      </div>
    </div>
    <div class="panel panel--noche" data-hsa-theme="noche">
      <p class="panel-title">Noche</p>
      <div class="opts">
        <label class="opt"><input type="radio" name="pago-noche" checked><strong>Pago contra entrega</strong><small>Pagas en efectivo al recibir tu pedido.</small><div class="art hsa-slot" data-hsa-scene="contra-entrega"></div></label>
        <label class="opt"><input type="radio" name="pago-noche"><strong>Transferencia bancaria</strong><small>Te enviamos los datos para transferir.</small><div class="art hsa-slot" data-hsa-scene="transferencia"></div></label>
        <label class="opt"><input type="radio" name="pago-noche"><strong>Tarjeta</strong><small>Débito o crédito con POS al recibir.</small><div class="art hsa-slot" data-hsa-scene="tarjeta-pos"></div></label>
      </div>
    </div>
  </section>

  <h2>Tamaños de lectura</h2>
  <section class="themes sizes" aria-label="Tamaños">
    <div class="panel panel--dia" data-hsa-theme="dia">
      <p class="panel-title">Día · 260 / 280 / 300 px</p>
      <div class="row">
        <div class="cell w260"><span>260 px</span><div class="hsa-slot" data-hsa-scene="contra-entrega"></div></div>
        <div class="cell w280"><span>280 px</span><div class="hsa-slot" data-hsa-scene="transferencia"></div></div>
        <div class="cell w300"><span>300 px</span><div class="hsa-slot" data-hsa-scene="tarjeta-pos"></div></div>
      </div>
    </div>
    <div class="panel panel--noche" data-hsa-theme="noche">
      <p class="panel-title">Noche · 260 / 280 / 300 px</p>
      <div class="row">
        <div class="cell w260"><span>260 px</span><div class="hsa-slot" data-hsa-scene="contra-entrega"></div></div>
        <div class="cell w280"><span>280 px</span><div class="hsa-slot" data-hsa-scene="transferencia"></div></div>
        <div class="cell w300"><span>300 px</span><div class="hsa-slot" data-hsa-scene="tarjeta-pos"></div></div>
      </div>
    </div>
  </section>

  <h2>Vista ampliada</h2>
  <section class="big" aria-label="Vista ampliada">
    <div class="panel panel--dia" data-hsa-theme="dia"><div class="hsa-slot" data-hsa-scene="contra-entrega"></div></div>
    <div class="panel panel--noche" data-hsa-theme="noche"><div class="hsa-slot" data-hsa-scene="contra-entrega"></div></div>
    <div class="panel panel--dia" data-hsa-theme="dia"><div class="hsa-slot" data-hsa-scene="transferencia"></div></div>
    <div class="panel panel--noche" data-hsa-theme="noche"><div class="hsa-slot" data-hsa-scene="transferencia"></div></div>
    <div class="panel panel--dia" data-hsa-theme="dia"><div class="hsa-slot" data-hsa-scene="tarjeta-pos"></div></div>
    <div class="panel panel--noche" data-hsa-theme="noche"><div class="hsa-slot" data-hsa-scene="tarjeta-pos"></div></div>
  </section>
</div>

<script>
  (function () {
    var buttons = document.querySelectorAll('.seg button');
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        document.body.setAttribute('data-view', b.getAttribute('data-view'));
        buttons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      });
    });
  })();
</script>
<script src="animations.js"></script>
